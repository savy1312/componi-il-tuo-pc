<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Componi il tuo PC</title>
    <meta name="description" content="Crea il tuo PC componente per componente e guardalo in 3D, con controllo di compatibilità." />
    <meta name="theme-color" content="#071029" />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Componi PC" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      html,body{margin:0;background:#071029}
      #splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(ellipse at 50% 38%,#12306e 0%,#0a1a42 45%,#050b1f 100%);transition:opacity .55s ease,transform .55s ease;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
      #splash.fuori{opacity:0;transform:scale(1.04);pointer-events:none}
      #splash .logo{position:relative;width:min(46vw,190px);aspect-ratio:1}
      #splash .logo img{position:relative;width:100%;height:100%;border-radius:22%;box-shadow:0 20px 60px -10px rgba(34,211,238,.55),0 0 0 1px rgba(255,255,255,.12);animation:sp-in .9s cubic-bezier(.2,.9,.25,1.15) both}
      #splash .logo::before,#splash .logo::after{content:"";position:absolute;inset:-14%;border-radius:30%;border:2px solid rgba(34,211,238,.55);animation:sp-ring 1.8s ease-out infinite}
      #splash .logo::after{animation-delay:.9s}
      #splash h1{margin:0;color:#eaf2ff;font-size:22px;font-weight:600;letter-spacing:-.01em;animation:sp-up .8s .35s ease both}
      #splash p{margin:-14px 0 0;color:#8fb1e8;font-size:13px;animation:sp-up .8s .5s ease both}
      #splash .barra{width:min(52vw,220px);height:4px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;animation:sp-up .8s .6s ease both}
      #splash .barra i{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,#22d3ee,#818cf8);transform-origin:left;animation:sp-bar 1.7s .5s cubic-bezier(.4,0,.2,1) both}
      @keyframes sp-in{from{opacity:0;transform:scale(.55) rotate(-8deg);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
      @keyframes sp-up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
      @keyframes sp-bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
      @keyframes sp-ring{0%{opacity:.9;transform:scale(.8)}100%{opacity:0;transform:scale(1.35)}}
      @media (prefers-reduced-motion:reduce){#splash *,#splash::before{animation-duration:.01s!important;animation-delay:0s!important}}
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Caricamento di Componi il tuo PC">
      <div class="logo"><img src="icons/splash-icon.png" alt="" width="190" height="190" /></div>
      <h1>Componi il tuo PC</h1>
      <p>Monta il tuo PC in 3D</p>
      <div class="barra"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
